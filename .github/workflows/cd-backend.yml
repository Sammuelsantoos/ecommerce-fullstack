name: CD - Backend (AWS)

# Deploy automático: roda quando o CI termina com sucesso na main.
# Fluxo: build da imagem -> push no ECR -> SSM Run Command na EC2 -> smoke test.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-backend
  cancel-in-progress: false

permissions:
  id-token: write # OIDC com a AWS (sem access keys no GitHub)
  contents: read

jobs:
  deploy:
    name: Build, push and deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 via SSM
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
        run: |
          SCRIPT_B64="$(base64 -w0 deploy/deploy.sh)"
          PARAMS="$(jq -n --arg b64 "$SCRIPT_B64" --arg image "$IMAGE" --arg region "$AWS_REGION" \
            '{commands: ["echo \($b64) | base64 -d > /tmp/deploy.sh", "bash /tmp/deploy.sh \($image) \($region)"]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $DEPLOY_SHA" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)"
          echo "SSM command: $COMMAND_ID"

          # Aguarda até 10 min
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in
              Success | Failed | Cancelled | TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text >&2

          [ "$STATUS" = "Success" ]

      - name: Smoke test (public API)
        if: ${{ vars.API_URL != '' }}
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS "${{ vars.API_URL }}/api/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "API não respondeu em ${{ vars.API_URL }}/api/health"
          exit 1
